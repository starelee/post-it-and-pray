<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>post it and pray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="screen">
    <div class="header">
      <h1 class="logo">post it <span class="pray">and pray</span></h1>
      <p class="tagline">오늘도 대충 해봅시다 ☁️</p>
      <p class="date" id="dateText"></p>
      <p class="counter" id="taskCounter"></p>
      <div class="header-actions">
        <div class="auth-row" id="authRow"></div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="테마 전환"></button>
      </div>
    </div>

    <div class="board-wrap">
      <div class="archive-panel" id="archivePanel">
        <div class="archive-panel-inner">
          <button class="archive-close-btn" id="archiveCloseBtn" type="button" aria-label="닫기">✕</button>
          <h2 class="archive-title">done 📋</h2>

          <div class="archive-section-divider"></div>
          <div class="archive-groups" id="archiveGroups"></div>

          <div data-upcoming-front>
            <h2 class="archive-title archive-section-title-spaced">
              not my problem... yet 😮‍💨
              <button class="trash-toggle-btn" id="trashToggleBtn" type="button" aria-label="최근 지운 항목 보기">↺ Ctrl+Z</button>
            </h2>
            <div class="archive-section-divider"></div>
            <ul class="archive-upcoming" id="archiveUpcoming"></ul>
          </div>

          <div data-upcoming-back hidden>
            <h2 class="archive-title archive-section-title-spaced">
              Ctrl+Z 😵‍💫
              <button class="trash-toggle-btn" id="trashToggleBackBtn" type="button" aria-label="원래대로">↩ 되돌아가기</button>
            </h2>
            <div class="archive-section-divider"></div>
            <ul class="archive-upcoming" id="archiveTrash"></ul>
          </div>
        </div>
      </div>

      <div class="board-row">
      <div class="sticky" data-board="today" id="todaySticky" style="--rot: -1.4deg;">
        <button class="archive-flag archive-flag-mobile" type="button" aria-label="다 한 일 보기"></button>
        <div class="tape"></div>

        <div data-today-list>
          <h2 class="sticky-title">gotta do... <span class="flower">✿</span>
            <button class="focus-enter-btn" id="focusEnterBtn" type="button" aria-label="포커스 모드">🍅</button>
          </h2>

          <ul class="task-list" data-tasklist="today"></ul>

          <div class="add-row">
            <button type="button" class="plus" aria-label="새 항목 등록">+</button>
            <input
              class="new-task-input"
              data-newtask
              placeholder="끄적이기..."
              autocomplete="off"
              maxlength="60"
            />
          </div>
        </div>

        <div data-today-focus hidden>
          <h2 class="sticky-title">
            <span class="focus-title-text" id="focusTitleText">focus... 🍅</span>
            <button class="focus-enter-btn" id="focusBackBtn" type="button" aria-label="gotta do 목록으로">✿</button>
          </h2>

          <div class="focus-body" id="focusBody"></div>

          <div class="focus-footer" id="focusFooter"></div>
        </div>
      </div>

      <div class="side-col">
        <div class="sticky" data-board="waiting" id="waitingSticky" style="--rot: 1.2deg; --paper: var(--paper-waiting);">
          <button class="archive-flag archive-flag-desktop" type="button" aria-label="다 한 일 보기"></button>
          <div data-lupin-front>
            <div class="tape"></div>
            <h2 class="sticky-title">waiting... <span class="flower">⏳</span>
              <button class="lupin-flip-btn" id="lupinFlipBtn" type="button" aria-label="루팡 모드로 뒤집기">🕶️</button>
            </h2>

            <ul class="task-list" data-tasklist="waiting"></ul>

            <div class="add-row">
              <button type="button" class="plus" aria-label="새 항목 등록">+</button>
              <input
                class="new-task-input"
                data-newtask
                placeholder="기다리는 거..."
                autocomplete="off"
                maxlength="60"
              />
            </div>
          </div>

          <div data-lupin-back data-board="lupin" hidden>
            <h2 class="sticky-title">lupin mode <span class="flower">🕶️</span>
              <button class="lupin-flip-btn" id="lupinFlipBackBtn" type="button" aria-label="원래대로 뒤집기">⏳</button>
            </h2>

            <ul class="task-list" data-tasklist="lupin"></ul>

            <div class="add-row">
              <button type="button" class="plus" aria-label="새 항목 등록">+</button>
              <input
                class="new-task-input"
                data-newtask
                placeholder="아무도 모르게..."
                autocomplete="off"
                maxlength="60"
              />
            </div>
          </div>
        </div>

        <div class="sticky" data-board="someday" style="--rot: -0.8deg; --paper: var(--paper-someday);">
          <div class="tape"></div>

          <button class="sticky-title sticky-title-toggle" type="button" data-collapse-toggle>
            pray later... <span class="flower">📅</span>
            <span class="toggle-arrow" data-toggle-arrow>▾</span>
          </button>
          <div class="collapsible-body" data-collapse-body hidden>
            <ul class="task-list" data-tasklist="scheduled"></ul>
          </div>

          <button class="sticky-title sticky-title-toggle sticky-title-toggle-spaced" type="button" data-collapse-toggle>
            someday... <span class="flower">🌙</span>
            <span class="toggle-arrow" data-toggle-arrow>▾</span>
          </button>
          <div class="collapsible-body" data-collapse-body hidden>
            <ul class="task-list" data-tasklist="someday"></ul>
          </div>

          <div class="add-row">
            <button type="button" class="plus" aria-label="새 항목 등록">+</button>
            <input
              class="new-task-input"
              data-newtask
              placeholder="미래에 내가..."
              autocomplete="off"
              maxlength="60"
            />
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <div class="bezel"></div>

<script src="script.js"></script>

</body>
</html>
